# IEQ-Ops dev infrastructure: Postgres + Qdrant + LangFuse.
# Phase 0 acceptance gate: `docker compose up` brings up all three.
# Values come from .env (see .env.example). Named volumes, not bind mounts,
# so no data dirs land in the repo.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ieqops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ieqops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate `langfuse` database on first init (app DB stays clean).
      - ./ops/deployment/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ieqops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # LangFuse v2 — single-Postgres self-host (v3 would add ClickHouse/Redis/MinIO,
  # overkill for a single-node dissertation deployment).
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ieqops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_HOST:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-nextauth-secret}
      SALT: ${LANGFUSE_SALT:-changeme-salt}
      TELEMETRY_ENABLED: "false"
      # Headless auto-provision on first boot (DB starts empty). Creates the org,
      # project, an initial user, and the API key pair the app authenticates with —
      # no manual UI step. Keys come from .env so app and server share one pair.
      LANGFUSE_INIT_ORG_ID: ieqops-org
      LANGFUSE_INIT_ORG_NAME: IEQ-Ops
      LANGFUSE_INIT_PROJECT_ID: ieqops-proj
      LANGFUSE_INIT_PROJECT_NAME: IEQ-Ops
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-dev@ieq-ops.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-dev}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-ieqops-dev-pw}

volumes:
  postgres_data:
  qdrant_data:
