<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEQ-Ops 问答管家</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  background:#f4f6f8; color:#1c2733; display:flex; flex-direction:column; height:100vh; }
header { background:#0f766e; color:#fff; padding:12px 16px; }
header h1 { margin:0 0 6px; font-size:18px; }
.readings { font-size:13px; opacity:.95; }
.chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.bubble { max-width:78%; padding:10px 14px; border-radius:14px; line-height:1.5;
  white-space:pre-wrap; word-break:break-word; }
.bubble.user { align-self:flex-end; background:#0f766e; color:#fff; border-bottom-right-radius:4px; }
.bubble.bot { align-self:flex-start; background:#fff; border:1px solid #e2e8f0;
  border-bottom-left-radius:4px; }
.inputbar { display:flex; gap:8px; padding:12px 16px; background:#fff;
  border-top:1px solid #e2e8f0; align-items:center; }
.inputbar input#q { flex:1; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px;
  font-size:15px; }
.inputbar button { padding:10px 16px; border:0; border-radius:10px; background:#0f766e;
  color:#fff; font-size:15px; cursor:pointer; }
.inputbar button#mic { background:#e2e8f0; color:#0f172a; }
.inputbar button#mic.on { background:#dc2626; color:#fff; }
.tts { font-size:13px; color:#475569; display:flex; align-items:center; gap:4px; }
.hint { padding:8px 16px 14px; font-size:12px; color:#64748b; background:#fff; }
</style>
</head>
<body>
<header>
  <h1>🏠 IEQ-Ops 问答管家</h1>
  <div id="readings" class="readings">读数加载中…</div>
</header>
<main id="chat" class="chat"></main>
<form id="form" class="inputbar">
  <input id="q" autocomplete="off" placeholder="问我房间的环境…(如:现在 CO2 多少)">
  <button type="submit">发送</button>
  <button type="button" id="mic" title="语音提问">🎤</button>
  <label class="tts"><input type="checkbox" id="ttsToggle" checked> 朗读</label>
</form>
<div class="hint">示例:现在 CO2 和温度多少 · 现在温度在正常范围内吗 · 过去 24 小时 CO2 平均和最高 · 最近有没有异常 · 帮我把空调打开</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const qInput = document.getElementById('q');
const micBtn = document.getElementById('mic');
const ttsToggle = document.getElementById('ttsToggle');

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addBubble(role, text){
  const b = document.createElement('div');
  b.className = 'bubble ' + role;
  b.innerHTML = esc(text);
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

function speak(text){
  if (!ttsToggle.checked) return;
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

async function askText(query){
  addBubble('user', query);
  const thinking = addBubble('bot', '…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ query })
    });
    const data = await r.json();
    thinking.innerHTML = esc(data.text);
    speak(data.text);
  } catch (e) { thinking.innerHTML = '请求失败:' + esc(String(e)); }
  chat.scrollTop = chat.scrollHeight;
}

async function askVoice(transcript){
  addBubble('user', '🎤 ' + transcript);
  const thinking = addBubble('bot', '…');
  try {
    const fd = new FormData();
    fd.append('debug_text', transcript);
    const r = await fetch('/api/voice/chat', { method: 'POST', body: fd });
    const data = await r.json();
    thinking.innerHTML = esc(data.text);
    speak(data.text);
  } catch (e) { thinking.innerHTML = '请求失败:' + esc(String(e)); }
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = qInput.value.trim();
  if (!q) return;
  qInput.value = '';
  askText(q);
});

// Voice input via the browser Web Speech API (no key). Real backend STT later.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = 'zh-CN'; rec.interimResults = false; rec.maxAlternatives = 1;
  let listening = false;
  micBtn.addEventListener('click', () => { if (listening) rec.stop(); else rec.start(); });
  rec.onstart = () => { listening = true; micBtn.classList.add('on'); micBtn.textContent = '⏺'; };
  rec.onend = () => { listening = false; micBtn.classList.remove('on'); micBtn.textContent = '🎤'; };
  rec.onresult = (ev) => { const t = ev.results[0][0].transcript.trim(); if (t) askVoice(t); };
  rec.onerror = (ev) => { addBubble('bot', '语音识别出错:' + esc(ev.error)); };
} else {
  micBtn.disabled = true;
  micBtn.title = '此浏览器不支持语音识别(请用 Chrome)';
}

async function loadReadings(){
  try {
    const r = await fetch('/api/sensors/current');
    const d = await r.json();
    const co2 = (typeof d.co2 === 'number') ? d.co2.toFixed(0) : d.co2;
    document.getElementById('readings').textContent =
      'CO₂ ' + co2 + ' ppm · 温度 ' + d.temperature + ' ℃ · 湿度 ' + d.humidity +
      '% · 光照 ' + d.lux + ' lux · 噪声 ' + d.noise_db + ' dBA';
  } catch (e) { document.getElementById('readings').textContent = '读数获取失败'; }
}
loadReadings();
setInterval(loadReadings, 15000);
</script>
</body>
</html>
