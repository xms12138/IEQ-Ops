<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEQ-Ops Room Butler</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, "Segoe UI", sans-serif;
  background:#f4f6f8; color:#1c2733; display:flex; flex-direction:column; height:100vh; }
header { background:#0f766e; color:#fff; padding:12px 16px; }
header h1 { margin:0 0 6px; font-size:18px; }
.readings { font-size:13px; opacity:.95; }
.chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.bubble { max-width:78%; padding:10px 14px; border-radius:14px; line-height:1.5;
  white-space:pre-wrap; word-break:break-word; }
.bubble.user { align-self:flex-end; background:#0f766e; color:#fff; border-bottom-right-radius:4px; }
.bubble.bot { align-self:flex-start; background:#fff; border:1px solid #e2e8f0;
  border-bottom-left-radius:4px; }
.inputbar { display:flex; gap:8px; padding:12px 16px; background:#fff;
  border-top:1px solid #e2e8f0; align-items:center; }
.inputbar input#q { flex:1; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px;
  font-size:15px; }
.inputbar button { padding:10px 16px; border:0; border-radius:10px; background:#0f766e;
  color:#fff; font-size:15px; cursor:pointer; }
.inputbar button#mic { background:#e2e8f0; color:#0f172a; }
.inputbar button#mic.on { background:#dc2626; color:#fff; }
.tts { font-size:13px; color:#475569; display:flex; align-items:center; gap:4px; }
.hint { padding:8px 16px 14px; font-size:12px; color:#64748b; background:#fff; }
.actions { padding:0 16px 10px; background:#fff; }
.actions button { font-size:12px; color:#64748b; background:none; border:0; cursor:pointer;
  padding:0; text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>🏠 IEQ-Ops Room Butler</h1>
  <div id="readings" class="readings">Loading readings…</div>
</header>
<main id="chat" class="chat"></main>
<div class="actions"><button type="button" id="newchat">New conversation</button></div>
<form id="form" class="inputbar">
  <input id="q" autocomplete="off" placeholder="Ask about the room… (e.g. what's the CO2 now?)">
  <button type="submit">Send</button>
  <button type="button" id="mic" title="Ask by voice">🎤</button>
  <label class="tts"><input type="checkbox" id="ttsToggle" checked> Read aloud</label>
</form>
<div class="hint">Try: what's the CO₂ and temperature now? · is the temperature in range? · what about humidity? · average and peak CO₂ over the past 24h · any recent anomalies?</div>

<script>
const MAX_TURNS = 6;  // keep only the last N messages of history when sending
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const qInput = document.getElementById('q');
const micBtn = document.getElementById('mic');
const ttsToggle = document.getElementById('ttsToggle');
let history = [];  // [{role, content}] — client-owned conversation memory (multi-turn)

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addBubble(role, text){
  const b = document.createElement('div');
  b.className = 'bubble ' + role;
  b.innerHTML = esc(text);
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

// Strip markdown markers so TTS doesn't read "asterisk asterisk" etc. The cloud TTS
// path stays clean via the respond prompt; this guards the browser-speech path.
function stripMarkdown(s){
  return s
    .replace(/[*_`#]+/g, '')        // bold / italic / code / heading markers
    .replace(/^\s*[-•]\s+/gm, '')   // bullet markers at line start
    .replace(/\s{2,}/g, ' ')        // collapse the whitespace they leave behind
    .trim();
}

// Browser TTS — fallback only, for the mock provider (no server audio). The agent
// speaks English, so force en-US regardless of the browser default voice.
function speak(text){
  if (!ttsToggle.checked) return;
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(stripMarkdown(text));
  u.lang = 'en-US';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// Gapless player for streamed CosyVoice audio (PCM 24 kHz mono 16-bit). Each frame is
// scheduled back-to-back on a Web Audio cursor so the answer is spoken as it arrives.
class PcmPlayer {
  constructor(sampleRate = 24000){ this.sampleRate = sampleRate; this.ctx = null; this.next = 0; this.frames = 0; }
  _ensure(){
    if (!this.ctx){
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.next = this.ctx.currentTime;
    }
  }
  push(int16){
    this._ensure();
    const f32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
    const buf = this.ctx.createBuffer(1, f32.length, this.sampleRate);
    buf.copyToChannel(f32, 0);
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.connect(this.ctx.destination);
    const t = Math.max(this.next, this.ctx.currentTime);
    src.start(t);
    this.next = t + buf.duration;
    this.frames++;
  }
}

function b64ToInt16(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Int16Array(bytes.buffer, 0, Math.floor(bin.length / 2));
}

// Captures mic audio and encodes a 16 kHz mono WAV blob for server-side English STT.
// (MediaRecorder yields webm/opus; Paraformer wants wav/pcm, so we encode WAV ourselves.)
class WavRecorder {
  constructor(targetRate = 16000){ this.targetRate = targetRate; this.chunks = []; this.ctx = null; this.stream = null; this.proc = null; this.srcRate = 0; }
  async start(){
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.srcRate = this.ctx.sampleRate;
    this.chunks = [];
    const source = this.ctx.createMediaStreamSource(this.stream);
    this.proc = this.ctx.createScriptProcessor(4096, 1, 1);
    this.proc.onaudioprocess = (e) => { this.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    source.connect(this.proc); this.proc.connect(this.ctx.destination);
  }
  stop(){
    if (this.proc) this.proc.disconnect();
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    const merged = this._merge(this.chunks);
    const down = this._downsample(merged, this.srcRate, this.targetRate);
    const blob = this._encodeWav(down, this.targetRate);
    if (this.ctx) this.ctx.close();
    return blob;
  }
  _merge(chunks){ let n = 0; chunks.forEach(c => n += c.length); const out = new Float32Array(n); let o = 0; chunks.forEach(c => { out.set(c, o); o += c.length; }); return out; }
  _downsample(buf, from, to){
    if (!from || to >= from) return buf;
    const ratio = from / to, newLen = Math.round(buf.length / ratio), out = new Float32Array(newLen);
    let oi = 0, ii = 0;
    while (oi < newLen){ const next = Math.round((oi + 1) * ratio); let s = 0, c = 0; for (let i = ii; i < next && i < buf.length; i++){ s += buf[i]; c++; } out[oi++] = c ? s / c : 0; ii = next; }
    return out;
  }
  _encodeWav(samples, rate){
    const buf = new ArrayBuffer(44 + samples.length * 2), view = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    w(36, 'data'); view.setUint32(40, samples.length * 2, true);
    let o = 44; for (let i = 0; i < samples.length; i++){ const x = Math.max(-1, Math.min(1, samples[i])); view.setInt16(o, x < 0 ? x * 32768 : x * 32767, true); o += 2; }
    return new Blob([view], { type: 'audio/wav' });
  }
}

// Text chat: stream the answer token-by-token from /api/chat (plain-text chunks).
async function askText(query){
  addBubble('user', query);
  const bot = addBubble('bot', '…');
  let full = '';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ query, history: JSON.stringify(history.slice(-MAX_TURNS)) })
    });
    if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      full += dec.decode(value, { stream: true });
      bot.innerHTML = esc(full);
      chat.scrollTop = chat.scrollHeight;
    }
    full = (full + dec.decode()).trim();
    bot.innerHTML = esc(full);
    if (full) {
      speak(full);
      history.push({ role: 'user', content: query }, { role: 'assistant', content: full });
    }
  } catch (e) { bot.innerHTML = 'Request failed: ' + esc(String(e)); }
  chat.scrollTop = chat.scrollHeight;
}

// Voice: streamed cascade. POST audio (+ web-speech transcript as a fallback for the
// mock provider) to /api/voice/stream and consume the NDJSON event stream — render the
// answer text as it streams and play PCM frames the instant they arrive.
async function askVoiceStream(transcript, wavBlob){
  const player = new PcmPlayer(24000);
  let bot = null, full = '', queryText = transcript || '', gotAudio = false;
  try {
    const fd = new FormData();
    if (wavBlob) fd.append('audio', wavBlob, 'speech.wav');
    fd.append('debug_text', transcript || '');
    fd.append('history', JSON.stringify(history.slice(-MAX_TURNS)));
    const r = await fetch('/api/voice/stream', { method: 'POST', body: fd });
    if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'query') { queryText = ev.text; addBubble('user', '🎤 ' + ev.text); bot = addBubble('bot', '…'); full = ''; }
        else if (ev.type === 'token') { if (!bot) bot = addBubble('bot', ''); full += ev.text; bot.innerHTML = esc(full); chat.scrollTop = chat.scrollHeight; }
        else if (ev.type === 'audio') { gotAudio = true; player.push(b64ToInt16(ev.pcm_b64)); }
        else if (ev.type === 'error') { if (!bot) bot = addBubble('bot', ''); bot.innerHTML = esc(ev.text); }
        else if (ev.type === 'done') {
          full = (ev.text || full).trim();
          if (bot) bot.innerHTML = esc(full);
          if (!gotAudio && full) speak(full);  // mock path: let the browser voice it
          if (full) history.push({ role: 'user', content: queryText }, { role: 'assistant', content: full });
          if (ev.first_package_ms != null) console.log('TTS first-package latency:', ev.first_package_ms, 'ms');
        }
      }
    }
  } catch (e) { (bot || addBubble('bot', '')).innerHTML = 'Request failed: ' + esc(String(e)); }
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = qInput.value.trim();
  if (!q) return;
  qInput.value = '';
  askText(q);
});

document.getElementById('newchat').addEventListener('click', () => {
  history = [];
  chat.innerHTML = '';
  addBubble('bot', 'Started a new conversation.');
});

// Mic: record real audio (for server STT) while Web Speech grabs a transcript (fallback
// for the keyless mock). Click to start, click again to stop and send.
const recorder = new WavRecorder(16000);
let recording = false, sttTranscript = '';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sr = null;
if (SR) {
  sr = new SR(); sr.lang = 'en-US'; sr.interimResults = false; sr.maxAlternatives = 1;
  sr.onresult = (ev) => { const t = ev.results[0][0].transcript.trim(); if (t) sttTranscript = t; };
  sr.onerror = () => {};
}
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  micBtn.addEventListener('click', async () => {
    if (!recording) {
      sttTranscript = '';
      try { await recorder.start(); } catch (e) { addBubble('bot', 'Mic error: ' + esc(String(e))); return; }
      if (sr) { try { sr.start(); } catch (e) {} }
      recording = true; micBtn.classList.add('on'); micBtn.textContent = '⏺';
    } else {
      recording = false; micBtn.classList.remove('on'); micBtn.textContent = '🎤';
      if (sr) { try { sr.stop(); } catch (e) {} }
      let wav = null; try { wav = recorder.stop(); } catch (e) {}
      setTimeout(() => askVoiceStream(sttTranscript, wav), 250);  // let Web Speech deliver its final result
    }
  });
} else {
  micBtn.disabled = true;
  micBtn.title = 'This browser does not support microphone capture (try Chrome)';
}

async function loadReadings(){
  try {
    const r = await fetch('/api/sensors/current');
    const d = await r.json();
    const co2 = (typeof d.co2 === 'number') ? d.co2.toFixed(0) : d.co2;
    document.getElementById('readings').textContent =
      'CO₂ ' + co2 + ' ppm · Temp ' + d.temperature + ' °C · Humidity ' + d.humidity +
      '% · Light ' + d.lux + ' lux · Noise ' + d.noise_db + ' dBA';
  } catch (e) { document.getElementById('readings').textContent = 'Failed to load readings'; }
}
loadReadings();
setInterval(loadReadings, 15000);
</script>
</body>
</html>
