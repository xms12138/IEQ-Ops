[project]
name = "ieq-ops"
version = "0.1.0"
description = "IEQ-Ops — autonomous building operations multi-agent system (CASA0022 dissertation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zihang He", email = "zihang.he.24@ucl.ac.uk" }]

# Core runtime. Kept deliberately lean — MCP (fastmcp), vector store
# (qdrant-client), embedding/rerank (FlagEmbedding) and InfluxDB are added
# with `uv add` when their Phase lands, not pre-installed.
dependencies = [
    "langgraph",                      # state machine; the only orchestration layer (no LangChain Chain/AgentExecutor — Hard Constraint #6/#7)
    "langgraph-checkpoint-postgres",  # Postgres checkpointer for the 15-min suspend/resume across restarts (Phase 1 risk #1)
    "psycopg[binary]",                # Postgres driver used by the checkpointer + ticket server
    "pydantic",                       # all LLM-facing schemas
    "pydantic-settings",              # typed .env loading
    "structlog",                      # structured JSON logs forwarded to LangFuse
    "openai",                         # DeepSeek is OpenAI-API-compatible; this client talks to deepseek-v4-pro / -flash
    "langfuse<3",                       # observability; every agent invocation logs a trace
    "fastmcp>=3.3.1",
    # ── Phase 2 retrieval stack (rag/ + mcp-rag-server). Heavy; lands with Phase 2.
    #    Loaded on GPU per the 6 GB VRAM spike (BGE-M3 + reranker fp16, TECH_STACK).
    "torch>=2.5,<2.7",           # cu121 wheel (see [tool.uv.sources]); same pin as the douluo spike venv
    "sentence-transformers",     # BGE-M3 dense encode — loaded exactly as ops/scripts/vram_spike.py
    "transformers",              # bge-reranker-v2-m3 via AutoModelForSequenceClassification (CrossEncoder/FlagReranker break in this venv)
    "qdrant-client",             # dense vectors + payload filter by domain
    "rank-bm25",                 # BM25 sparse path for dual recall
    "langchain-text-splitters",  # RecursiveCharacterTextSplitter only — NOT langchain Chain/Agent (Hard Constraint #6/#7)
    "pypdf>=6.13.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

# This repo is a deployable application, not a distributable library, so uv
# does not need to build/install it as a package. Code runs from the repo root
# (`uv run python -m core.xxx`), which puts the root on sys.path.
[tool.uv]
package = false

# torch from the CUDA 12.1 wheel index (the RTX 3060 runs cu121; same pin as the
# douluo spike venv). Without this uv resolves the CPU build, and retrieve blows
# the < 500 ms budget by 7.5x (TECH_STACK VRAM spike, 2026-05-25).
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["core", "agents", "memory", "rag", "mcp_servers", "sensing", "eval"]

# mypy --strict is mandated on core/ only (CLAUDE.md Coding Standards).
[tool.mypy]
python_version = "3.11"
strict = true
files = ["core"]

# langfuse ships no py.typed; the router binds its traced client to the real
# OpenAI type, so silencing the missing-stub import keeps core/ fully checked.
[[tool.mypy.overrides]]
module = ["langfuse.*"]
ignore_missing_imports = true

# rank_bm25 ships no py.typed/stubs; reached transitively via rag/retrieve.py.
[[tool.mypy.overrides]]
module = ["rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
