  <g id="text_18">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="22.830844" transform="rotate(-0 0 22.830844)">The same 4 seeded recurrence tasks and the same episodic store, replayed after each change to how the</text>
