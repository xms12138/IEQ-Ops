  </g>
  <g id="text_22">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="205.030406" transform="rotate(-0 0 205.030406)">Source: eval/reports/ablate-memory-20260531T*.json. Development history on an early n = 4 set across three domains;</text>
