  <g id="text_28">
   <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #121211" x="0" y="10.5345" transform="rotate(-0 0 10.5345)">The reranker, not fusion, is what makes rank-1 retrieval work</text>
  </g>
  <g id="text_29">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="22.830844" transform="rotate(-0 0 22.830844)">n = 32 corpus-anchored questions. Configurations are alternative settings of the same retriever read left</text>
  </g>
  <g id="text_30">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="32.598844" transform="rotate(-0 0 32.598844)">to right in pipeline order — the ▲▼ labels are differences between adjacent configurations, not additive</text>
  </g>
  <g id="text_31">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="42.366844" transform="rotate(-0 0 42.366844)">contributions.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="242.806406" transform="rotate(-0 0 242.806406)">configurations are indistinguishable — the argument only exists at rank 1.</text>
  </g>
  <g id="text_33">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="233.830406" transform="rotate(-0 0 233.830406)">disclosed negative result on this corpus and is NOT deployed. R@5 is shown because at k=5 four of the five</text>
  </g>
  <g id="text_34">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="224.854406" transform="rotate(-0 0 224.854406)">alone (position-based merging demotes correct chunks) and the reranker recovers it; contextual prefixing is a</text>
  </g>
  <g id="text_35">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="215.878406" transform="rotate(-0 0 215.878406)">Source: eval/reports/retrieval-pipeline-ablation-*.json (Table 8). RRF fusion costs 0.16 at rank 1 versus dense</text>
  </g>
 </g>
