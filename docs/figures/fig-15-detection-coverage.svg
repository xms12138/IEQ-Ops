   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="197.878406" transform="rotate(-0 0 197.878406)">Source: eval/reports/autonomy-*.json (Table E4). Contains NO LLM and no IEQ content — it bounds what continuous</text>
