  </g>
  <g id="text_27">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="215.830406" transform="rotate(-0 0 215.830406)">absolute reactive values are an upper bound on the gap, not a measurement of this system. Seeded (rng=42), single</text>
  </g>
  <g id="text_28">
