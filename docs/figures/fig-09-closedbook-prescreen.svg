   <g id="text_11">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="59.558493" y="157.748529" transform="rotate(-0 59.558493 157.748529)">squares are grouped by outcome within each domain</text>
