  <g id="text_12">
   <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #121211" x="0" y="10.5345" transform="rotate(-0 0 10.5345)">Closed-book pre-screen: the base model misses 21 of 37 WELL v2 thresholds</text>
  </g>
  <g id="text_13">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="22.830844" transform="rotate(-0 0 22.830844)">One square = one standards question, 0.43 correct overall (n = 37). Airquality carries 22/37 because the</text>
  </g>
  <g id="text_14">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="32.598844" transform="rotate(-0 0 32.598844)">WELL Air section is the largest part of the corpus — disclosed, not balanced away.</text>
  </g>
  <g id="text_15">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="192.406406" transform="rotate(-0 0 192.406406)">ungrounded answering already fails.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="183.430406" transform="rotate(-0 0 183.430406)">· single run, temperature 0. This pre-screen is what justifies the question set: it isolates the items where</text>
  </g>
  <g id="text_17">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="174.454406" transform="rotate(-0 0 174.454406)">Source: eval/reports/closedbook-prescreen-*.json (Table 7) · same base model and deterministic grader as Figure 11</text>
  </g>
