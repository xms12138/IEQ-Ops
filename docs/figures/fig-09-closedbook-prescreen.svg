   </g>
   <g id="text_10">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="245.479699" y="140.869866" transform="rotate(-0 245.479699 140.869866)">wrong closed-book — the item retrieval has to fix</text>
