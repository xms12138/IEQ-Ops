  <g id="text_19">
   <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #121211" x="0" y="10.5345" transform="rotate(-0 0 10.5345)">Proactive detection lands inside one scan; reactive checking lags by ~an hour</text>
  </g>
  <g id="text_20">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="22.830844" transform="rotate(-0 0 22.830844)">Empirical CDF of the lead-time of every detected event. The two curves are NOT drawn from the same</text>
  </g>
  <g id="text_21">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="32.598844" transform="rotate(-0 0 32.598844)">denominator: the proactive arm detects all 400 of 400 events, the reactive 2 h arm only 39 — the 361 it</text>
  </g>
  <g id="text_22">
   <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4f4e4a" x="0" y="42.366844" transform="rotate(-0 0 42.366844)">never sees have no lead-time and cannot appear here.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="221.206406" transform="rotate(-0 0 221.206406)">carries the coverage side of the same run. Scheduling model only, no LLM; seeded (rng=42), single run.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #86847e" x="0" y="212.230406" transform="rotate(-0 0 212.230406)">Source: eval/reports/autonomy-*.json (Table E4). Conditioning on detection flatters the reactive arm; Figure E3</text>
  </g>
 </g>
